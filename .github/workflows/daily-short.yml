name: Daily GTA 6 Short

on:
  schedule:
    - cron: "23 12 * * *"   # every day 12:23 UTC
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to YouTube after rendering"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  make-short:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          curl -sSfL -o assets/fonts/Anton-Regular.ttf \
            https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf || true

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Build today's Short
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
          AUTO_UPLOAD: ${{ (inputs.upload || vars.AUTO_UPLOAD == '1') && '1' || '0' }}
        run: python -m gta6shorts

      - name: Save video package
        uses: actions/upload-artifact@v4
        with:
          name: gta6-short-${{ github.run_number }}
          path: output/
          retention-days: 30

      - name: Remember covered topics
        run: |
          git config user.name "gta6-shorts-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/history.json
          git diff --cached --quiet || (git commit -m "Daily Short: update topic history" && git push)
